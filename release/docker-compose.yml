# Релизный Compose: только готовый образ (без build:).
# Загрузите образ: gzip -dc lunafast-tablet-deploy-v1.0.1.tar.gz | docker load
# Положите этот файл рядом с каталогом ./apks/ и выполните: docker compose up

services:
  tablet-deploy:
    image: lunafast-tablet-deploy:v1.0.1
    init: true
    stdin_open: true
    tty: true
    network_mode: host
    volumes:
      - ./apks:/apks:ro
    command: []
